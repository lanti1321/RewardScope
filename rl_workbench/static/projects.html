<body><aside class="sidebar"><a class="brand" href="/">RL Workbench</a></aside><main><header><h1>RL 项目规范扫描</h1></header><section class="panel"><p>选择含 rl-project.json 的项目根目录。扫描校验 v1 格式与代码入口，不执行项目代码。</p><form id="scan-form"><label for="project-root">项目根目录</label><input id="project-root" required placeholder="/home/you/my_rl_project"><button type="submit" id="scan-button" class="primary">扫描并校验</button></form></section><section class="panel" aria-live="polite"><h2 id="scan-status">等待扫描</h2><p id="scan-note"></p><div id="scan-result"></div></section></main></body></html>
